<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>波形复核 · wavepick</title>
<style>
  :root {
    --event: #d64545;
    --silence: #9e9e9e;
    --wave: #355c8a;
  }
  body {
    margin: 0;
    padding: 16px 20px;
    font: 14px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
    color: #222;
    background: #fff;
  }
  #bar { display: flex; gap: 8px; align-items: center; }
  #report-path { flex: 1; max-width: 480px; padding: 5px 8px; font-size: 14px; }
  #load { padding: 5px 16px; font-size: 14px; cursor: pointer; }
  #verdict { margin: 10px 0 14px; font-size: 16px; font-weight: 600; }
  #verdict .zero { color: #2a7a2a; }
  #verdict .bad { color: var(--event); }
  .file-block { margin: 0 0 22px; }
  .file-head { font-size: 13px; color: #555; margin-bottom: 3px; }
  .file-head b { color: #222; }
  svg.scope {
    display: block;
    width: 100%;
    height: 150px;
    background: #fafafa;
    border: 1px solid #ddd;
  }
  rect.event { fill: var(--event); fill-opacity: 0.4; }
  rect.silence { fill: var(--silence); fill-opacity: 0.4; }
  rect.mark-event { fill: none; stroke: var(--event); stroke-width: 2; stroke-dasharray: 6 4; }
  rect.mark-silence { fill: none; stroke: #6f6f6f; stroke-width: 2; stroke-dasharray: 6 4; }
  path.wave { fill: var(--wave); fill-opacity: 0.85; }
  .legend { margin: 4px 0 14px; font-size: 12px; color: #777; }
  .legend span { margin-right: 18px; }
  .swatch { display: inline-block; width: 12px; height: 12px; vertical-align: -1px; margin-right: 4px; border: 1px solid #999; }
</style>
</head>
<body>
<div id="bar">
  <label for="report-path">报告</label>
  <input id="report-path" value="../var/report.json" spellcheck="false">
  <button id="load" type="button">加载</button>
</div>
<div id="verdict"></div>
<div class="legend">
  <span><i class="swatch" style="background:#d64545;opacity:.6"></i>事件（引擎）</span>
  <span><i class="swatch" style="background:#9e9e9e;opacity:.6"></i>静音（引擎）</span>
  <span><i class="swatch" style="border:2px dashed #d64545;background:none"></i>人工标注</span>
</div>
<div id="files"></div>
<script type="module" src="./app.js"></script>
</body>
</html>
